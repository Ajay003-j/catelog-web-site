{% extends "base.html" %}

{% block title %}All Books{% endblock %}
{% block content %}
    {% if user.is_authenticated %}
        Hello, {{ user.username }}
    {% endif %}
    <ul>
        {% for note in  notes %}
            <li><a href="{% url 'notes-details' note.pk %}">{{ note.title }}</a></li>
        {% empty %}
            <li> No notes </li>
        {% endfor %}
    </ul>

{% endblock %}
